global_args:
  trainer_backend: hf
  enable_deepspeed: false
  enable_ptv2: false
  enable_lora: true

  # 关键：开启 QLoRA 4bit
  load_in_bit: 4
  precision: auto
  config_merge: {}          # ← 必须是一个空字典或字典
  pre_seq_len: null
  prefix_projection: null
  num_layers_freeze: -1
  model_name: glm-4-9b-chat

  # 关键：bitsandbytes 的 4bit 配置
  quantization_config:
    load_in_8bit: false
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    # A100 建议 bfloat16；若报错可改成 float16
    bnb_4bit_compute_dtype: bfloat16

global_models_mapper:
  glm-4-9b-chat:
    model_type: chatglm
    model_name_or_path: THUDM/glm-4-9b-chat
    tokenizer_name: THUDM/glm-4-9b-chat
    trust_remote_code: true

  glm-4-9b-chat-1m:
    model_type: chatglm
    model_name_or_path: THUDM/glm-4-9b-chat-1m
    tokenizer_name: THUDM/glm-4-9b-chat-1m
    trust_remote_code: true
